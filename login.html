<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Bromelain Bright</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animation.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, var(--cream), var(--beige));">
  <div style="max-width:440px;width:90%;margin:var(--space-xl);">
    <div style="text-align:center;margin-bottom:var(--space-lg);">
      <a href="index.html" class="btn btn-secondary btn-sm" style="margin-bottom:var(--space-md);background:var(--white);">← เข้าชมหน้าแรกของเว็บ (ไม่ต้องเข้าสู่ระบบ)</a>
      <br>
      <a href="index.html" class="nav-logo" style="font-size:var(--fs-2xl);">Bromelain <span style="color:var(--sage)">Bright</span></a>
    </div>
    <div class="card-glass" style="padding:var(--space-2xl);">
      <h2 style="text-align:center;font-size:var(--fs-2xl);margin-bottom:var(--space-sm);">Welcome Back</h2>
      <p style="text-align:center;color:var(--gray-500);font-size:var(--fs-sm);margin-bottom:var(--space-lg);">Sign in to your account</p>

      <!-- Demo Credentials Box -->
      <div style="background:rgba(var(--sage-rgb),0.1);border:1px solid var(--sage);border-radius:var(--radius-md);padding:var(--space-md);margin-bottom:var(--space-lg);font-size:var(--fs-xs);color:var(--forest);">
        <div style="font-weight:700;margin-bottom:4px;">🔑 Demo Account Credentials:</div>
        <div><strong>Email:</strong> demo@bromelainbright.com</div>
        <div><strong>Password:</strong> password123</div>
        <button type="button" onclick="fillDemoUser()" class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;padding:6px 12px;font-size:11px;">Auto-fill Demo Account</button>
      </div>

      <form id="login-form">
        <div class="form-group"><label class="form-label">Email</label><input type="email" name="email" class="form-input" placeholder="you@example.com" required></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" name="password" class="form-input" placeholder="••••••••" required></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-xl);">
          <label style="display:flex;align-items:center;gap:var(--space-sm);font-size:var(--fs-sm);color:var(--gray-500);cursor:pointer;"><input type="checkbox"> Remember me</label>
          <a href="#" style="font-size:var(--fs-sm);color:var(--sage);">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Sign In</button>
      </form>
      <div style="text-align:center;margin-top:var(--space-xl);font-size:var(--fs-sm);color:var(--gray-500);">
        Don't have an account? <a href="register.html" style="color:var(--sage);font-weight:600;">Sign up</a>
      </div>
    </div>
    <div style="text-align:center;margin-top:var(--space-xl);"><a href="index.html" style="font-size:var(--fs-sm);color:var(--gray-400);">← Back to Home</a></div>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script><script src="js/auth.js"></script>
</body>
</html>
