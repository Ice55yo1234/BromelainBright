<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Bromelain Bright</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animation.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="nav"><div class="nav-inner"><a href="index.html" class="nav-logo">Bromelain <span>Bright</span></a><div class="nav-links"><a href="index.html" data-i18n="nav.home">Home</a><a href="products.html" data-i18n="nav.products">Products</a><a href="shop.html" data-i18n="nav.shop">Shop</a><a href="research.html" data-i18n="nav.research">Research</a><a href="sustainability.html" data-i18n="nav.sustainability">Sustainability</a><a href="company.html" data-i18n="nav.company">Company</a><a href="contact.html" data-i18n="nav.contact">Contact</a></div><div class="nav-actions">
        <button id="lang-toggle" onclick="toggleLang()" class="btn btn-outline" style="padding:4px 8px;font-size:var(--fs-xs);border-color:var(--gray-200);color:var(--forest);background:transparent;" title="Switch Language">🇬🇧 EN</button><a href="cart.html" style="position:relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><span class="cart-badge" style="display:none">0</span></a><button onclick="logout()" style="color:var(--gray-500);font-size:var(--fs-sm);">Logout</button></div><div class="nav-hamburger"><span></span><span></span><span></span></div></div></nav>
  <div class="nav-mobile"><a href="index.html" data-i18n="nav.home">Home</a><a href="products.html" data-i18n="nav.products">Products</a><a href="shop.html" data-i18n="nav.shop">Shop</a><a href="contact.html" data-i18n="nav.contact">Contact</a><a href="#" onclick="logout()">Logout</a></div>

  <div class="page-header"><div class="container"><span class="text-overline">My Account</span><h1>Dashboard</h1></div></div>

  <section class="section">
    <div class="container">
      <div class="grid grid-3" style="grid-template-columns:1fr 2fr;gap:var(--space-2xl);align-items:start;">
        <!-- Sidebar -->
        <div>
          <div class="card" style="padding:var(--space-2xl);text-align:center;" data-aos="fade-right">
            <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg, var(--sage), var(--emerald));display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-lg);color:white;font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:700;">
              <span class="dash-user-initial" style="font-size:var(--fs-2xl);">U</span>
            </div>
            <h3 class="dash-user-name" style="font-size:var(--fs-lg);">User</h3>
            <p class="dash-user-email" style="color:var(--gray-400);font-size:var(--fs-sm);">email@example.com</p>
            <p class="dash-user-joined" style="color:var(--gray-400);font-size:var(--fs-xs);margin-top:var(--space-sm);">Member since 2024</p>
            <div class="divider"></div>
            <div style="display:flex;flex-direction:column;gap:var(--space-sm);">
              <a href="shop.html" class="btn btn-sage btn-sm" style="width:100%;">Shop Now</a>
              <a href="ai-analysis.html" class="btn btn-secondary btn-sm" style="width:100%;">AI Analysis</a>
              <button onclick="logout()" class="btn btn-secondary btn-sm" style="width:100%;color:var(--danger);border-color:var(--danger);">Logout</button>
            </div>
          </div>
        </div>

        <!-- Content -->
        <div data-aos="fade-left">
          <!-- Wishlist -->
          <div class="card" style="padding:var(--space-xl);margin-bottom:var(--space-xl);">
            <h3 style="margin-bottom:var(--space-lg);">❤️ My Wishlist</h3>
            <div class="dash-wishlist"></div>
          </div>

          <!-- Orders -->
          <div class="card" style="padding:var(--space-xl);">
            <h3 style="margin-bottom:var(--space-lg);">📦 Order History</h3>
            <div class="dash-orders"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2024 Bromelain Bright.</span><span>Made with 🍍 in Thailand</span></div></div></footer>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script><script src="js/i18n.js"></script>
  <script src="js/app.js"></script><script src="js/shop.js"></script><script src="js/animation.js"></script><script src="js/auth.js"></script>
  <script>AOS.init({duration:800,once:true,offset:80});</script>
</body>
</html>
